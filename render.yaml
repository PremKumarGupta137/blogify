services:
  - type: web
    name: blogify
    runtime: node
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
